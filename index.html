<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lyo Patagonia · Sistema de Producción y Calidad</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#ffffff; --ink:#2b2622; --muted:#7c736a;
    --line:#e7e1d6; --brand:#3f6f4e; --brand-d:#2f543b; --accent:#c6882f;
    --danger:#b23b3b; --ok:#3f6f4e; --chip:#eef3ee;
    --radius:14px; --shadow:0 2px 10px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%;}
  button{font-family:inherit; cursor:pointer}
  input,select,textarea{font-family:inherit; font-size:16px}
  .hidden{display:none !important}

  /* ---------- Login ---------- */
  #login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); width:100%; max-width:380px; padding:26px}
  .logo{display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:6px}
  .logo .mark{width:40px;height:40px;border-radius:11px;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:20px}
  .logo .name{font-weight:800;font-size:20px;letter-spacing:.3px}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin:2px 0 20px}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  .field{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;
    background:#fff;color:var(--ink);outline:none}
  .field:focus{border-color:var(--brand)}
  .pin{letter-spacing:8px;text-align:center;font-size:22px}
  .btn{width:100%;padding:14px;border:none;border-radius:11px;background:var(--brand);
    color:#fff;font-weight:700;font-size:16px;margin-top:20px}
  .btn:active{background:var(--brand-d)}
  .btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.sm{width:auto;padding:9px 14px;font-size:14px;margin:0}
  .btn.danger{background:var(--danger)}
  .btn.accent{background:var(--accent)}
  .msg{margin-top:14px;font-size:14px;text-align:center;min-height:18px}
  .msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}

  /* ---------- App shell ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column}
  header.top{background:var(--brand);color:#fff;padding:12px 16px;display:flex;
    align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20}
  header.top .l{display:flex;align-items:center;gap:10px}
  header.top .mark{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--brand);
    display:grid;place-items:center;font-weight:800}
  header.top .who{font-size:13px;opacity:.95}
  header.top .who b{display:block;font-size:15px}
  .tabs{display:flex;gap:6px;overflow-x:auto;background:var(--panel);
    border-bottom:1px solid var(--line);padding:8px 10px;position:sticky;top:54px;z-index:10}
  .tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600}
  .tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  main{padding:16px;max-width:1000px;width:100%;margin:0 auto;flex:1}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .panel h2{margin:0 0 4px;font-size:18px}
  .panel .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
  .rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .spacer{flex:1}
  .search{flex:1;min-width:140px;max-width:280px;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  tr:last-child td{border-bottom:none}
  .tbl-wrap{overflow-x:auto}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.on{background:var(--chip);color:var(--brand-d)}
  .pill.off{background:#f3e5e5;color:var(--danger)}
  .pill.gray{background:#eee;color:#666}
  .link{color:var(--brand);font-weight:700;background:none;border:none;padding:4px 6px;font-size:14px}
  .empty{color:var(--muted);text-align:center;padding:26px;font-size:14px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
  .tile .n{font-size:28px;font-weight:800;color:var(--brand-d)}
  .tile .t{font-size:13px;color:var(--muted);margin-top:4px}

  /* ---------- Modal ---------- */
  .ov{position:fixed;inset:0;background:rgba(30,26,22,.45);display:flex;align-items:flex-start;
    justify-content:center;padding:20px;z-index:50;overflow:auto}
  .modal{background:var(--panel);border-radius:var(--radius);width:100%;max-width:520px;
    padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.2);margin:auto}
  .modal h3{margin:0 0 14px;font-size:18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal label{margin-top:0}
  .modal .full{grid-column:1/-1}
  .modal .actions{display:flex;gap:10px;margin-top:18px}
  .modal .actions .btn{margin-top:0}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px}
  .chk input{width:20px;height:20px}
  @media(max-width:560px){ .grid2{grid-template-columns:1fr} header.top .who b{font-size:14px} }

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);
    color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:100;box-shadow:var(--shadow);
    opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}

  /* ---- Trazabilidad ---- */
  .kv{display:flex;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dotted var(--line)}
  .kv .k{color:var(--muted);min-width:130px;font-weight:600}
  .kv .v{flex:1}
  .trace-h{margin:14px 0 4px;font-weight:800;color:var(--brand-d);font-size:13px}

  /* ---- Sub-navegación (Calidad) ---- */
  .subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .subtab{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;
    font-size:14px;font-weight:600;color:var(--ink)}
  .subtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* ---- Checklists ---- */
  .chk-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .chk-item .t{font-weight:600;margin-bottom:8px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:8px 14px;font-size:13px;font-weight:700;color:var(--muted);border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.on-cumple{background:var(--brand);color:#fff}
  .seg button.on-nc{background:var(--danger);color:#fff}
  .seg button.on-na{background:#8a8278;color:#fff}
  .badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:var(--chip);
    color:var(--brand-d);margin-left:6px;text-transform:uppercase;letter-spacing:.3px;font-weight:700}
  .badge.sem{background:#f0e6d0;color:#8a6d28}
  .badge.crit{background:#f3e5e5;color:var(--danger)}
  .totbar{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin:12px 0;font-weight:700;color:var(--brand-d)}
  .chk-obs{margin-top:8px;width:100%}

  /* ---- Etiqueta imprimible ---- */
  .label{border:1px solid #000;border-radius:6px;padding:12px 14px;background:#fff;color:#111;
    width:320px;margin:0 auto;font-size:12px}
  .label .l-brand{color:var(--brand-d);font-weight:800;font-size:15px;letter-spacing:.3px}
  .label .l-name{font-size:19px;font-weight:800;margin:4px 0}
  .label .l-sub{color:#555;font-size:12px;margin-bottom:8px}
  .label .l-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
  .label .l-grid b{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.3px}
  .label svg{display:block;margin:8px auto 2px}
  .label .l-ean{text-align:center;font-family:monospace;margin:6px 0;font-size:13px}
  .label .l-legal{font-size:9px;color:#333;border-top:1px solid #ccc;padding-top:6px;margin-top:8px;line-height:1.4}
  @media print{
    body *{visibility:hidden}
    #printArea,#printArea *{visibility:visible}
    #printArea{position:absolute;left:0;top:0;width:90mm;border:none;border-radius:0}
    .ov{background:none!important;padding:0!important}
  }
</style>
</head>

<!-- ============ LOGIN ============ -->
<section id="login">
  <div class="card">
    <div class="logo" style="background:var(--brand);border-radius:12px;padding:14px 18px;justify-content:center">
      <img id="loginLogo" alt="Lyo Patagonia" style="height:46px;display:block"></div>

  <main id="view"></main>
</section>

/* ========================= ESTADO ========================= */
let USER = null;           // {id, nombre, rol}
let CACHE = { mp:[], prov:[] };

/* ========================= HELPERS ========================= */
const $ = s => document.querySelector(s);
const el = (t,a={},...kids)=>{const n=document.createElement(t);
  for(const k in a){ if(k==='class')n.className=a[k]; else if(k==='html')n.innerHTML=a[k];
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),a[k]); else n.setAttribute(k,a[k]); }
  kids.flat().forEach(c=>n.appendChild(typeof c==='string'?document.createTextNode(c):c)); return n;};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ===== Capa de datos SEGURA: todo pasa por funciones con token de sesión ===== */
async function dbList(tabla, o={}){
  const {data,error}=await sb.rpc('api_select',{p_token:USER.token, p_tabla:tabla,
    p_filtros:o.filtros||{}, p_orden_col:o.ordenCol||null, p_orden_dir:o.ordenDir||'asc',
    p_limite:o.limite||1000, p_nulls_last:o.nullsLast!==false});
  return {data: error?null:(data||[]), error};
}
async function dbGet(tabla, id){ const {data,error}=await dbList(tabla,{filtros:{id}}); return {data:(data&&data[0])||null, error}; }
async function dbInsert(tabla, obj){ const {data,error}=await sb.rpc('api_insert',{p_token:USER.token,p_tabla:tabla,p_data:obj}); return {data,error}; }
async function dbInsertMany(tabla, rows){ if(!rows||!rows.length) return {error:null}; const {error}=await sb.rpc('api_insert_rows',{p_token:USER.token,p_tabla:tabla,p_rows:rows}); return {error}; }
async function dbUpdate(tabla, id, obj){ const {data,error}=await sb.rpc('api_update',{p_token:USER.token,p_tabla:tabla,p_id:id,p_data:obj}); return {data,error}; }
async function dbDeleteEq(tabla, campo, valor){ const {error}=await sb.rpc('api_delete',{p_token:USER.token,p_tabla:tabla,p_campo:campo,p_valor:valor}); return {error}; }
async function dbCount(tabla, filtros={}){ const {data,error}=await sb.rpc('api_count',{p_token:USER.token,p_tabla:tabla,p_filtros:filtros}); return {count: error?0:(data||0), error}; }
async function mapById(tabla){ const {data}=await dbList(tabla,{limite:5000}); const m={}; (data||[]).forEach(r=>m[r.id]=r); return m; }

async function bitacora(accion, entidad, entidad_id, detalle){
  try{ await dbInsert('bitacora',{usuario:USER?.nombre, accion, entidad,
    entidad_id:String(entidad_id??''), detalle:detalle||null}); }catch(e){/* no bloquea */}
}

/* ========================= LOGIN ========================= */
async function cargarUsuariosLogin(){
  const sel = $('#loginNombre');
  const { data, error } = await sb.rpc('fn_usuarios_lista');
  if(error){ sel.innerHTML='<option value="">(error de conexión)</option>'; return; }
  sel.innerHTML = '<option value="">Elige tu nombre…</option>' +
    (data||[]).map(u=>`<option value="${esc(u.nombre)}">${esc(u.nombre)}</option>`).join('');
}
async function login(){
  const nombre = $('#loginNombre').value;
  const pin = $('#loginPin').value.trim();
  const msg = $('#loginMsg'); msg.className='msg'; msg.textContent='';
  if(!nombre){ msg.className='msg err'; msg.textContent='Elige tu usuario.'; return; }
  if(!pin){ msg.className='msg err'; msg.textContent='Escribe tu PIN.'; return; }
  $('#btnLogin').disabled=true; $('#btnLogin').textContent='Entrando…';
  const { data, error } = await sb.rpc('fn_login',{ p_nombre:nombre, p_pin:pin });
  $('#btnLogin').disabled=false; $('#btnLogin').textContent='Entrar';
  if(error){ msg.className='msg err'; msg.textContent='Error: '+error.message; return; }
  if(!data || !data.length){ msg.className='msg err'; msg.textContent='PIN incorrecto.';
    $('#loginPin').value=''; return; }
  USER = data[0];
  bitacora('login','usuarios',USER.id,null);
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#whoName').textContent = USER.nombre;
  $('#whoRol').textContent = rolLabel(USER.rol);
  $('#loginPin').value='';
  buildTabs(); go('inicio');
}
function logout(){ try{ if(USER&&USER.token) sb.rpc('fn_logout',{p_token:USER.token}); }catch(e){}
  USER=null; CACHE={mp:[],prov:[]}; $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden'); $('#loginNombre').value=''; }
function rolLabel(r){return {admin:'Administrador',operario:'Operario',calidad:'Calidad',
  bodega:'Bodega',lectura:'Solo lectura'}[r]||r;}

/* ========================= NAV ========================= */
const TABS = [
  {id:'inicio',     label:'Inicio'},
  {id:'recepcion',  label:'Recepción'},
  {id:'stock',      label:'Stock MP'},
  {id:'produccion', label:'Producción'},
  {id:'liberacion', label:'Liberación'},
  {id:'despachos',  label:'Despachos'},
  {id:'trazabilidad',label:'Trazabilidad'},
  {id:'calidad',    label:'Calidad'},
  {id:'mp',         label:'Materias primas'},
  {id:'prod',       label:'Productos'},
  {id:'prov',       label:'Proveedores'},
  {id:'usuarios',   label:'Usuarios', admin:true},
  {id:'cuenta',     label:'Mi cuenta'},
];
// Operarios solo ven lo de producción (ingreso de MP, bandejas y producto terminado)
const OPERARIO_TABS=['inicio','recepcion','produccion','cuenta'];
function tabVisible(t){
  if(t.admin && USER.rol!=='admin') return false;
  if(USER.rol==='operario') return OPERARIO_TABS.includes(t.id);
  return true;
}
function buildTabs(){
  const nav=$('#tabs'); nav.innerHTML='';
  TABS.filter(tabVisible).forEach(t=>{
    nav.appendChild(el('button',{class:'tab','data-id':t.id,onclick:()=>go(t.id)},t.label));
  });
}

function estadoTareaPill(e){ const m={pendiente:['off','Pendiente'],hecho:['gray','Firmado · espera calidad'],verificado:['on','Verificado ✓'],observado:['off','Observado por calidad']}; const [c,t]=m[e||'pendiente']||['gray',e]; return el('span',{class:'pill '+c},t); }
async function renderMisTareas(v){
  const {data:asig}=await dbList('plan_semanal',{filtros:{fecha:hoyISO()}});
  const mias=(asig||[]).filter(a=>a.responsable===USER.nombre);
  const p=el('div',{class:'panel'});
  p.appendChild(el('h2',{},'Tus tareas de hoy'));
  p.appendChild(el('p',{class:'hint'},'Lo que tienes asignado hoy según la planificación. Hazlo y fírmalo; luego calidad lo revisa.'));
  if(!mias.length){ p.appendChild(el('p',{class:'hint'},'No tienes tareas asignadas para hoy. 🎉')); v.appendChild(p); return; }
  const plm=await mapById('checklist_plantillas');
  mias.forEach(a=>{
    const pl=plm[a.plantilla_id];
    const row=el('div',{class:'chk-item',style:'display:flex;align-items:center;gap:12px;flex-wrap:wrap'});
    row.appendChild(el('div',{style:'flex:1;min-width:160px'}, el('b',{}, pl?pl.nombre:'Tarea'),
      el('div',{style:'font-size:12px;color:var(--muted)'}, pl?(pl.zona||''):'')));
    row.appendChild(estadoTareaPill(a.estado));
    if(!a.estado || a.estado==='pendiente'){
      if(pl) row.appendChild(el('button',{class:'btn accent sm',onclick:()=>formHacerChecklist(pl, a)},'Hacer y firmar'));
    } else if(a.checklist_id){
      row.appendChild(el('button',{class:'link',onclick:()=>verChecklist(a.checklist_id)},'Ver'));
    }
    if(a.estado==='observado' && a.verif_nota) row.appendChild(el('div',{style:'width:100%;color:var(--danger);font-size:13px'},'Calidad: '+esc(a.verif_nota)));
    p.appendChild(row);
  });
  v.appendChild(p);
}
async function viewInicio(){

async function formCerrarBatch(b){
  const {data:bd}=await dbList('bandejas',{filtros:{batch_id:b.id}});
  const total=(bd||[]).reduce((s,x)=>s+(Number(x.kg)||0),0);
  if(total<=0){ toast('Este batch no tiene bandejas cargadas'); return; }
  const prod=(await dbList('productos',{filtros:{id:b.producto_id}})).data[0]||{};
  const {data:bl}=await dbList('batch_lotes_mp',{filtros:{batch_id:b.id}});
  const loteRow=(bl||[])[0];
  const loteMp = loteRow ? (await dbList('lotes_mp',{filtros:{id:loteRow.lote_mp_id}})).data[0] : null;
  const disp = loteMp ? Number(loteMp.cantidad_restante) : 0;
  const merma=el('input',{class:'field',type:'number',placeholder:'0'});
  const seco=el('input',{class:'field',type:'number',placeholder:'kg secos'});
  const humedad=el('input',{class:'field',type:'number',placeholder:'% (≤5)'});
  const bolsas=el('input',{class:'field',type:'number',placeholder:'nº bolsas/unidades'});
  const mercado=el('select',{class:'field'});
  mercado.innerHTML='<option value="chile">Chile (12 meses)</option><option value="export">Exportación (18 meses)</option>';
  const obs=el('textarea',{class:'field',rows:'2'});
  const tot=el('div',{class:'totbar'});
  function calc(){ const m=Number(merma.value)||0, sc=Number(seco.value)||0; const consumo=total+m, rend=total>0?(sc/total*100):0;
    tot.innerHTML=`<span>Cargado: <b>${fmtKg(total)} kg</b> (${(bd||[]).length} bandejas)</span><span>Consumo: <b>${consumo.toFixed(2)} kg</b></span><span>Rendimiento: <b>${rend.toFixed(1)}%</b></span>`; }
  merma.addEventListener('input',calc); seco.addEventListener('input',calc); calc();
  const body=el('div',{},
    el('div',{class:'trace-h'}, 'Cerrar '+b.codigo+' · '+(prod.nombre||'')),
    tot,
    row2(lab('Merma total (kg)',merma), lab('Peso seco total (kg)',seco)),
    row2(lab('Humedad (%)',humedad), lab('Bolsas / unidades producidas',bolsas)),
    lab('Mercado (define vencimiento)',mercado),
    lab('Observaciones',obs));
  openCustomModal('Cerrar batch', body, async ()=>{
    const m=Number(merma.value)||0, sc=seco.value?Number(seco.value):null, hum=humedad.value?Number(humedad.value):null;
    const consumo=total+m, rend= total>0 && sc!=null?(sc/total*100):null;
    if(loteMp && consumo>disp+0.0001){ toast(`El consumo (${consumo.toFixed(2)} kg) supera el stock del lote (${fmtKg(disp)} kg).`); return false; }
    const uCaja=Number(prod.u_por_caja)||24;
    const vmeses= mercado.value==='export'?(Number(prod.vida_util_export_m)||18):(Number(prod.vida_util_chile_m)||12);
    const venc=addMonthsISO(b.fecha,vmeses);
    const nBolsas=bolsas.value?Number(bolsas.value):0, cajas=uCaja?Math.floor(nBolsas/uCaja):0;
    const up=await dbUpdate('batches',b.id,{peso_total:total,merma:m,consumo_mp:consumo,peso_seco:sc,rendimiento:rend,humedad:hum,estado:'cuarentena',observaciones:obs.value.trim()||null});
    if(up.error){toast('Error: '+up.error.message);return false;}
    if(loteRow) await dbUpdate('batch_lotes_mp',loteRow.id,{kg:consumo});
    if(loteMp) await dbUpdate('lotes_mp',loteMp.id,{cantidad_restante:Math.max(0,disp-consumo)});
    await dbInsert('lotes_pt',{producto_id:b.producto_id,batch_id:b.id,codigo_lote:b.codigo,
      fecha_elab:b.fecha,fecha_venc:venc,mercado:mercado.value,bolsas:nBolsas,cajas,kg:sc,estado:'cuarentena'});
    await bitacora('cerrar_batch','batches',b.codigo,{total,consumo,rend,hum,bolsas:nBolsas});
    toast('Batch '+b.codigo+' cerrado. Producto terminado en cuarentena.'); viewProduccion(); return true;
  });
}

async function viewLiberacion(){

function formLiberar(l){
  const hum=l.batches?l.batches.humedad:null; const humOk= hum!=null && hum<=5;
  const info=el('div',{class:'hint'}, `${l.codigo_lote} · ${l.productos?l.productos.nombre:''} · Elab ${l.fecha_elab} · Vence ${l.fecha_venc}`);
  const humLine=el('div',{style:'margin:6px 0'}, 'Humedad del batch: ',
    hum!=null?el('b',{style:humOk?'color:var(--ok)':'color:var(--danger)'}, hum+'% '+(humOk?'(cumple ≤5%)':'(NO cumple ≤5%)')):el('b',{},'sin dato'));
  const lab=inp('Laboratorio análisis','lab','','Opcional');
  const fechaA=inp('Fecha análisis','fa','','',' date');
  const salm=sel('Salmonella','salm',[['','—'],['ausencia','Ausencia (conforme)'],['presencia','Presencia (NO conforme)']],'');
  const visual=checkbox('Inspección visual conforme', true);
  const decision=sel('Decisión','dec',[['liberado','Liberar ✅'],['retenido','Retener (seguir en espera)'],['no_conforme','Declarar NO CONFORME']], humOk?'liberado':'retenido');
  const nota=inpArea('Observación / motivo','nota','');
  openModal('Revisar y liberar — '+l.codigo_lote,
    [fullWrap(info),fullWrap(humLine),lab.wrap,fechaA.wrap,fullWrap(salm.wrap),fullWrap(visual.wrap),fullWrap(decision.wrap),fullWrap(nota.wrap)],
    async ()=>{
      const dec=decision.el.value;
      const analisis=[];
      if(hum!=null) analisis.push({lote_pt_id:l.id,parametro:'Humedad',resultado:hum+'%',conforme:humOk,laboratorio:'Interno',fecha:fechaA.el.value||null});
      if(salm.el.value) analisis.push({lote_pt_id:l.id,parametro:'Salmonella',resultado:salm.el.value,conforme:salm.el.value==='ausencia',laboratorio:lab.el.value.trim()||null,fecha:fechaA.el.value||null});
      if(analisis.length){ const ra=await dbInsertMany('analisis',analisis); if(ra.error){toast('Error análisis: '+ra.error.message);return false;} }
      const nuevo = dec==='liberado'?'liberado':'retenido';
      const upd={estado:nuevo}; if(dec==='liberado') upd.liberado_por=USER.nombre;
      const r=await dbUpdate('lotes_pt',l.id,upd);
      if(r.error){toast('Error: '+r.error.message);return false;}
      if(l.batch_id) await dbUpdate('batches',l.batch_id,{estado: dec==='liberado'?'liberado':(dec==='no_conforme'?'no_conforme':'cuarentena')});
      await dbInsert('registros_calidad',{tipo:'liberacion',responsable:USER.nombre,
        datos:{lote:l.codigo_lote,decision:dec,humedad:hum,salmonella:salm.el.value||null,visual:visual.el.checked,nota:nota.el.value||null}});
      if(dec==='no_conforme') await dbInsert('no_conformidades',{fecha:hoyISO(),origen:'PT',referencia:l.codigo_lote,
        descripcion:nota.el.value||'Producto no conforme en liberación', criterio: hum!=null?('Humedad '+hum+'% vs ≤5%'):null, autoriza:USER.nombre});
      await bitacora('liberacion','lotes_pt',l.codigo_lote,{decision:dec,humedad:hum});
      toast(dec==='liberado'?'Lote liberado ✅':dec==='no_conforme'?'Lote NO CONFORME registrado':'Lote retenido');
      viewLiberacion(); return true;
    });
}

  p.appendChild(el('div',{class:'rowbtns'}, q, btn));

      for(const pt of pts) await traceFromPT(pt,out); return; }

    const _lm=await mapById('lotes_mp'), _mp=await mapById('materias_primas'), _pv=await mapById('proveedores');
    (bl||[]).forEach(x=>{const l=_lm[x.lote_mp_id]; if(l){l.materias_primas=_mp[l.materia_prima_id]||null; l.proveedores=_pv[l.proveedor_id]||null;} x.lotes_mp=l||null;});
    card.appendChild(el('div',{class:'trace-h'},'↑ Materia prima usada (de dónde viene)'));
    (bl||[]).forEach(x=>{const l=x.lotes_mp; if(!l)return;
      card.appendChild(kv(l.materias_primas?`${l.materias_primas.codigo} · ${l.materias_primas.nombre}`:'MP',

  }

async function traceFromMP(mp,out){
  const card=el('div',{class:'panel',style:'background:#fbfaf6'});
  card.appendChild(el('h3',{style:'margin:0 0 8px'},'🧊 Materia prima · lote '+(mp.lote_proveedor||'s/l')));
  card.appendChild(kv('Materia prima', mp.materias_primas?`${mp.materias_primas.codigo} · ${mp.materias_primas.nombre}`:'—'));
  card.appendChild(kv('Proveedor', mp.proveedores?mp.proveedores.nombre:'—'));
  card.appendChild(kv('Recepción', mp.fecha_recepcion)); card.appendChild(kv('Vence', mp.vencimiento));
  card.appendChild(kv('Disponible', fmtKg(mp.cantidad_restante)+' de '+fmtKg(mp.cantidad_kg)+' kg'));
  const {data:bl}=await dbList('batch_lotes_mp',{filtros:{lote_mp_id:mp.id}});
  const _bm=await mapById('batches'), _pm=await mapById('productos');
  (bl||[]).forEach(x=>{const b=_bm[x.batch_id]; if(b){b.productos=_pm[b.producto_id]||null;} x.batches=b||null;});
  card.appendChild(el('div',{class:'trace-h'},'↓ Batches que usaron este lote (recall hacia adelante)'));
  if(!bl||!bl.length){ card.appendChild(el('p',{class:'hint'},'Este lote aún no se ha usado en producción.')); out.appendChild(card); return; }
  for(const x of bl){ const b=x.batches; if(!b)continue;
    card.appendChild(kv('Batch '+b.codigo, `${b.productos?b.productos.codigo:''} · ${b.fecha} · usó ${fmtKg(x.kg)} kg`));
    const {data:pts}=await dbList('lotes_pt',{filtros:{batch_id:b.id}});
    for(const pt of (pts||[])){
      const {data:dsp}=await dbList('despachos',{filtros:{lote_pt_id:pt.id}});
      const clientes=(dsp||[]).map(d=>d.cliente).join(', ')||'sin despachos';
      card.appendChild(kv('  → PT '+pt.codigo_lote+' ('+pt.estado+')', 'Clientes: '+clientes));
    }
  }
  out.appendChild(card);
}

async function formHacerChecklist(pl, planRow){

  const DEF_RESP=(_plan&&_plan[0]&&_plan[0].responsable)||USER.nombre;
  function userSelect(def){ const s=el('select',{class:'field chk-obs'});
    s.innerHTML='<option value="">— ¿quién lo hizo? —</option>'+USERS.map(n=>`<option ${n===def?'selected':''}>${esc(n)}</option>`).join(''); return s; }

  items.forEach(it=>{
    state[it.id]={resultado:'cumple',obs:'',verif:'',responsable:DEF_RESP};
    const bC=el('button',{},'Cumple'), bN=el('button',{},'No cumple'), bA=el('button',{},'N/A');
    function paint(){ bC.className=state[it.id].resultado==='cumple'?'on-cumple':''; bN.className=state[it.id].resultado==='no_cumple'?'on-nc':''; bA.className=state[it.id].resultado==='na'?'on-na':''; }
    bC.onclick=()=>{state[it.id].resultado='cumple';paint();calc();};
    bN.onclick=()=>{state[it.id].resultado='no_cumple';paint();calc();};
    bA.onclick=()=>{state[it.id].resultado='na';paint();calc();};
    const seg=el('div',{class:'seg'},bC,bN,bA); paint();
    const obsIn=el('input',{class:'field chk-obs',placeholder:'Observación (opcional)'});
    obsIn.addEventListener('input',e=>state[it.id].obs=e.target.value);
    const title=el('div',{class:'t'}, it.texto);
    if(it.frecuencia==='semanal') title.appendChild(el('span',{class:'badge sem'},'Semanal'));
    if(it.frecuencia==='mensual') title.appendChild(el('span',{class:'badge sem'},'Mensual'));
    if(it.critico) title.appendChild(el('span',{class:'badge crit'},'Crítico 2ª✔'));
    const respSel=userSelect(DEF_RESP); respSel.addEventListener('change',e=>state[it.id].responsable=e.target.value);
    const row=el('div',{class:'chk-item'}, title, seg, respSel);
    if(it.critico){ const vIn=el('input',{class:'field chk-obs',placeholder:'Verificado por (2ª firma)'}); vIn.addEventListener('input',e=>state[it.id].verif=e.target.value); row.appendChild(vIn); }
    row.appendChild(obsIn); itemsBox.appendChild(row);
  });
  function calc(){
    let cumpl=0,nc=0,ev=0;
    items.forEach(it=>{const r=state[it.id].resultado; if(r==='na')return; ev++; if(r==='cumple')cumpl++; if(r==='no_cumple')nc++;});
    tot.innerHTML=`<span>Cumplidos: <b>${cumpl}/${ev}</b></span><span>No conformes: <b style="color:${nc>0?'var(--danger)':'inherit'}">${nc}</b></span>`;

    row2(lab('Fecha',fecha), lab('Monitor (ejecuta)',monitor)),

      acciones_correctivas:acciones.value.trim()||null, observaciones:obs.value.trim()||null, estado:'cerrado'};

    await dbInsertMany('checklist_respuestas',rows);
    if(r.nc>0 && genNC.el.checked){
      const fallos=items.filter(it=>state[it.id].resultado==='no_cumple').map(it=>it.texto+(state[it.id].obs?(' ('+state[it.id].obs+')'):'')).join('; ');
      const {count}=await dbCount('no_conformidades');
      await dbInsert('no_conformidades',{numero:'NC-'+new Date().getFullYear()+'-'+String((count||0)+1).padStart(3,'0'),
        fecha:cl.fecha, origen:'otro', referencia:pl.codigo||pl.nombre,
        descripcion:'Checklist '+pl.nombre+': '+fallos, criterio:'Checklist diario', autoriza:USER.nombre,
        accion_correctiva:cl.acciones_correctivas});
    }
    await bitacora('checklist','checklists',pl.codigo,{cumpl:r.cumpl,nc:r.nc});
    if(planRow){ await dbUpdate('plan_semanal',planRow.id,{estado:'hecho',firmado_por:USER.nombre,firmado_at:new Date().toISOString(),checklist_id:clId}); }
    toast('Checklist guardado y firmado'+(r.nc>0&&genNC.el.checked?' · se registró una NC':''));
    if(planRow) viewInicio(); else viewCalidad(); return true;
  });

/* ---- Planificación semanal ---- */
const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
let PLAN_WEEK=null;
function mondayOf(iso){ const d=new Date(iso+'T00:00:00'); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d.toISOString().slice(0,10); }
function addDaysISO(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+Number(n)); return d.toISOString().slice(0,10); }
async function calPlan(host){
  if(!PLAN_WEEK) PLAN_WEEK=mondayOf(hoyISO());
  const p=el('div',{class:'panel'});
  p.appendChild(el('h2',{},'Planificación semanal de labores'));
  p.appendChild(el('p',{class:'hint'},'Asigna a cada persona qué checklist/zona le toca cada día. Cuando esa persona llene el checklist ese día, ya vendrá sugerida como responsable. Abajo ves cuántas tareas tiene cada uno, para repartir parejo.'));
  const lun=PLAN_WEEK, dom=addDaysISO(PLAN_WEEK,6);
  const nav=el('div',{class:'rowbtns'});
  nav.appendChild(el('button',{class:'btn sec sm',onclick:()=>{PLAN_WEEK=addDaysISO(PLAN_WEEK,-7);viewCalidad();}},'← Semana'));
  nav.appendChild(el('div',{style:'font-weight:800;color:var(--brand-d);padding:8px 10px'}, `${fmtFecha(lun)} – ${fmtFecha(dom)}`));
  nav.appendChild(el('button',{class:'btn sec sm',onclick:()=>{PLAN_WEEK=addDaysISO(PLAN_WEEK,7);viewCalidad();}},'Semana →'));
  nav.appendChild(el('button',{class:'btn sec sm',onclick:()=>{PLAN_WEEK=mondayOf(hoyISO());viewCalidad();}},'Hoy'));
  p.appendChild(nav); host.appendChild(p);
  const {data:plns}=await dbList('checklist_plantillas',{filtros:{activo:true},ordenCol:'zona'});
  const {data:_us}=await sb.rpc('fn_usuarios_lista'); const USERS=(_us||[]).map(u=>u.nombre);
  const fechas=[0,1,2,3,4,5,6].map(i=>addDaysISO(PLAN_WEEK,i));
  const {data:asigAll}=await dbList('plan_semanal',{limite:5000});
  const key=(f,pl)=>f+'|'+pl;
  const amap={}; (asigAll||[]).forEach(a=>amap[key(a.fecha,a.plantilla_id)]=a);
  const carga={}; USERS.forEach(n=>carga[n]=0);
  fechas.forEach(f=>(plns||[]).forEach(pl=>{const a=amap[key(f,pl.id)]; if(a&&a.responsable&&carga[a.responsable]!=null)carga[a.responsable]++;}));
  const thead=el('tr',{}, th('Checklist / zona'));
  fechas.forEach((f,i)=>thead.appendChild(th(DIAS[i]+' '+f.slice(8,10)+'/'+f.slice(5,7))));
  const tbody=el('tbody');
  (plns||[]).forEach(pl=>{
    const tr=el('tr',{}, td(el('div',{}, el('b',{},pl.zona||pl.nombre), el('div',{style:'font-size:11px;color:var(--muted)'},pl.codigo||''))));
    fechas.forEach(f=>{
      const a=amap[key(f,pl.id)];
      const s=el('select',{class:'field',style:'padding:6px;font-size:13px;min-width:120px'});
      s.innerHTML='<option value="">—</option>'+USERS.map(n=>`<option ${a&&a.responsable===n?'selected':''}>${esc(n)}</option>`).join('');
      s.addEventListener('change',async()=>{
        const val=s.value||null; const ex=amap[key(f,pl.id)];
        if(ex){ await dbUpdate('plan_semanal',ex.id,{responsable:val}); ex.responsable=val; }
        else { const r=await dbInsert('plan_semanal',{fecha:f,plantilla_id:pl.id,responsable:val}); if(r.data)amap[key(f,pl.id)]=r.data; }
        toast('Asignación guardada');
      });
      tr.appendChild(td(s));
    });
    tbody.appendChild(tr);
  });
  const p2=el('div',{class:'panel'});
  if(!plns||!plns.length){ p2.appendChild(el('p',{class:'empty'},'No hay plantillas de checklist. Créalas en "Plantillas".')); }
  else { const w=el('div',{class:'tbl-wrap'}); w.appendChild(el('table',{}, el('thead',{},thead), tbody)); p2.appendChild(w); }
  host.appendChild(p2);
  const resumen=el('div',{class:'panel'});
  resumen.appendChild(el('h3',{style:'margin:0 0 8px;font-size:15px'},'Carga de la semana (tareas asignadas por persona)'));
  const chips=el('div',{style:'display:flex;gap:10px;flex-wrap:wrap'});
  if(USERS.length) USERS.forEach(n=>chips.appendChild(el('span',{class:'pill '+(carga[n]>0?'on':'gray')}, `${n}: ${carga[n]}`)));
  else chips.appendChild(el('span',{class:'hint'},'No hay usuarios.'));
  resumen.appendChild(chips); host.appendChild(resumen);
}

/* ---- Verificación de tareas (calidad revisa lo que firmaron los operarios) ---- */
async function calVerificacion(host){
  const p=el('div',{class:'panel'});
  p.appendChild(el('h2',{},'Verificación de tareas'));
  p.appendChild(el('p',{class:'hint'},'Tareas que los operarios ya firmaron como hechas (según la planificación). Calidad revisa el checklist y aprueba o deja una observación.'));
  const filtro=el('select',{class:'search'});
  filtro.innerHTML='<option value="hecho">Por verificar</option><option value="verificado">Verificadas</option><option value="observado">Observadas</option>';
  filtro.addEventListener('change',()=>load(filtro.value));
  const bar=el('div',{class:'rowbtns'}); bar.appendChild(filtro); bar.appendChild(el('div',{class:'spacer'})); p.appendChild(bar);
  const wrap=el('div',{class:'tbl-wrap'}); const tbody=el('tbody');
  const tbl=el('table',{}, el('thead',{}, el('tr',{}, th('Fecha'),th('Tarea / zona'),th('Firmó'),th('Estado'),th(''))), tbody);
  wrap.appendChild(tbl); p.appendChild(wrap); host.appendChild(p);
  await load('hecho');
  async function load(estado){
    tbody.innerHTML='';
    const {data}=await dbList('plan_semanal',{filtros:{estado},ordenCol:'fecha',ordenDir:'desc',limite:300});
    if(!data||!data.length){tbody.appendChild(trMsg('Nada aquí.'));return;}
    const plm=await mapById('checklist_plantillas');
    data.forEach(a=>{ const pl=plm[a.plantilla_id];
      const acc=el('div',{class:'rowbtns',style:'margin:0'});
      if(a.checklist_id) acc.appendChild(el('button',{class:'link',onclick:()=>verChecklist(a.checklist_id)},'Ver checklist'));
      if(a.estado==='hecho' && canCalidad()) acc.appendChild(el('button',{class:'link',onclick:()=>formVerificar(a)},'Verificar'));
      tbody.appendChild(el('tr',{}, td(a.fecha||'—'), td(pl?(pl.zona||pl.nombre):'—'), td(a.firmado_por||'—'), td(estadoTareaPill(a.estado)), td(acc)));
    });
  }
}
function formVerificar(a){
  const dec=sel('Resultado','dec',[['verificado','Conforme ✓'],['observado','Observado (no conforme)']],'verificado');
  const nota=inpArea('Observación (si algo no quedó bien)','nota','');
  openModal('Verificar tarea',[fullWrap(dec.wrap),fullWrap(nota.wrap)],
    async ()=>{
      const {error}=await dbUpdate('plan_semanal',a.id,{estado:dec.el.value,verificado_por:USER.nombre,
        verificado_at:new Date().toISOString(),verif_ok:dec.el.value==='verificado',verif_nota:nota.el.value.trim()||null});
      if(error){toast('Error: '+error.message);return false;}
      await bitacora('verificar_tarea','plan_semanal',a.id,{estado:dec.el.value});
      toast(dec.el.value==='verificado'?'Tarea verificada ✓':'Tarea observada'); viewCalidad(); return true;
    });
}

/* ========================= USUARIOS (admin) ========================= */
async function viewUsuarios(){
  const v=$('#view'); v.innerHTML='';
  if(USER.rol!=='admin'){ v.appendChild(el('div',{class:'panel'},
    el('p',{class:'empty'},'Solo los administradores pueden ver usuarios.'))); return; }
  const p=el('div',{class:'panel'});
  p.appendChild(el('h2',{},'Usuarios'));
  p.appendChild(el('p',{class:'hint'},'Personas que entran al sistema. El rol define qué ve cada uno: los Operarios solo ven Recepción y Producción. Puedes crear, cambiar rol, resetear PIN y activar/desactivar.'));
  const bar=el('div',{class:'rowbtns'});
  bar.appendChild(el('div',{class:'spacer'}));
  bar.appendChild(el('button',{class:'btn accent sm',onclick:()=>formUsuario()},'+ Nuevo usuario'));
  p.appendChild(bar);
  const wrap=el('div',{class:'tbl-wrap'});
  const tbody=el('tbody');
  const tbl=el('table',{}, el('thead',{}, el('tr',{},
    th('Nombre'),th('Rol'),th('Estado'),th('Acciones'))), tbody);
  wrap.appendChild(tbl); p.appendChild(wrap); v.appendChild(p);
  const {data,error}=await sb.rpc('fn_usuarios_admin');
  if(error){tbody.appendChild(trMsg('Error: '+error.message));return;}
  (data||[]).forEach(u=>{
    const acc=el('div',{class:'rowbtns',style:'margin:0'});
    acc.appendChild(el('button',{class:'link',onclick:()=>formRol(u)},'Rol'));
    acc.appendChild(el('button',{class:'link',onclick:()=>resetPin(u)},'Resetear PIN'));
    acc.appendChild(el('button',{class:'link',onclick:()=>toggleActivo(u),style:u.activo?'color:#b23b3b':'color:#3f6f4e'},
      u.activo?'Desactivar':'Activar'));
    tbody.appendChild(el('tr',{},
      td(el('b',{},u.nombre)), td(rolLabel(u.rol)), td(pill(u.activo)), td(acc)));
  });
}
function formUsuario(){
  const f={
    nombre:inp('Nombre','nombre','','Ej. María'),
    pin:inp('PIN inicial','pin','','4 a 8 dígitos'),
    rol:sel('Rol','rol',[['operario','Operario'],['calidad','Calidad'],['bodega','Bodega'],['admin','Administrador'],['lectura','Solo lectura']],'operario'),
  };
  openModal('Nuevo usuario',[f.nombre.wrap,f.pin.wrap,fullWrap(f.rol.wrap)],
    async ()=>{
      const nombre=f.nombre.el.value.trim(), pin=f.pin.el.value.trim(), rol=f.rol.el.value;
      if(!nombre||!pin){toast('Nombre y PIN son obligatorios');return false;}
      if(pin.length<4){toast('El PIN debe tener al menos 4 dígitos');return false;}
      const {error}=await sb.rpc('fn_crear_usuario',{p_nombre:nombre,p_pin:pin,p_rol:rol});
      if(error){toast('Error: '+error.message);return false;}
      await bitacora('crear','usuarios',nombre,{rol});
      toast('Usuario creado'); viewUsuarios(); return true;
    });
}
function formRol(u){
  const rol=sel('Rol','rol',[['operario','Operario (solo Recepción y Producción)'],['calidad','Calidad'],['bodega','Bodega'],['admin','Administrador'],['lectura','Solo lectura']], u.rol);
  openModal('Cambiar rol de '+u.nombre,[fullWrap(rol.wrap)],
    async ()=>{
      const {error}=await sb.rpc('fn_set_rol',{p_id:u.id,p_rol:rol.el.value});
      if(error){toast('Error: '+error.message);return false;}
      await bitacora('cambiar_rol','usuarios',u.id,{rol:rol.el.value});
      toast('Rol actualizado'); viewUsuarios(); return true;
    });
}
function resetPin(u){
  const f={pin:inp('Nuevo PIN','pin','','4 a 8 dígitos')};
  openModal('Resetear PIN de '+u.nombre,[fullWrap(f.pin.wrap)],
    async ()=>{
      const pin=f.pin.el.value.trim();
      if(pin.length<4){toast('El PIN debe tener al menos 4 dígitos');return false;}
      const {error}=await sb.rpc('fn_reset_pin',{p_id:u.id,p_pin_nuevo:pin});
      if(error){toast('Error: '+error.message);return false;}
      await bitacora('reset_pin','usuarios',u.id,null);
      toast('PIN actualizado'); return true;
    });
}
async function toggleActivo(u){
  const {error}=await sb.rpc('fn_set_activo',{p_id:u.id,p_activo:!u.activo});
  if(error){toast('Error: '+error.message);return;}
  await bitacora(u.activo?'desactivar':'activar','usuarios',u.id,null);
  toast(u.activo?'Usuario desactivado':'Usuario activado'); viewUsuarios();
}

/* ========================= MI CUENTA ========================= */
function viewCuenta(){
  const v=$('#view'); v.innerHTML='';
  const p=el('div',{class:'panel'});
  p.appendChild(el('h2',{},'Mi cuenta'));
  p.appendChild(el('p',{class:'hint'},'Sesión iniciada como '+USER.nombre+' ('+rolLabel(USER.rol)+').'));
  p.appendChild(el('h3',{style:'margin:18px 0 10px;font-size:16px'},'Cambiar mi PIN'));
  const f={
    actual:inp('PIN actual','actual','','',' password'),
    nuevo:inp('PIN nuevo','nuevo','','',' password'),
    rep:inp('Repetir PIN nuevo','rep','','',' password'),
  };
  [f.actual,f.nuevo,f.rep].forEach(x=>{x.el.setAttribute('inputmode','numeric');x.el.setAttribute('maxlength','8');});
  const box=el('div',{style:'max-width:360px'}, f.actual.wrap,f.nuevo.wrap,f.rep.wrap);
  const btn=el('button',{class:'btn accent',style:'margin-top:14px',onclick:async()=>{
    const a=f.actual.el.value.trim(), n=f.nuevo.el.value.trim(), r=f.rep.el.value.trim();
    if(!a||!n){toast('Completa los campos');return;}
    if(n.length<4){toast('El PIN nuevo debe tener al menos 4 dígitos');return;}
    if(n!==r){toast('Los PIN nuevos no coinciden');return;}
    btn.disabled=true;
    const {data,error}=await sb.rpc('fn_cambiar_pin',{p_id:USER.id,p_pin_actual:a,p_pin_nuevo:n});
    btn.disabled=false;
    if(error){toast('Error: '+error.message);return;}
    if(!data){toast('El PIN actual no es correcto');return;}
    await bitacora('cambiar_pin','usuarios',USER.id,null);
    f.actual.el.value=f.nuevo.el.value=f.rep.el.value='';
    toast('PIN cambiado correctamente');
  }},'Guardar nuevo PIN');
  box.appendChild(btn); p.appendChild(box); v.appendChild(p);
}

/* ========================= UI FACTORY ========================= */
function canEdit(){ return ['admin','calidad'].includes(USER.rol); }
function canOperate(){ return USER.rol!=='lectura'; }
/* --- loaders con cache --- */
async function loadMP(){ if(!CACHE.mp.length){const {data}=await dbList('materias_primas',{ordenCol:'codigo'});CACHE.mp=data||[];} return CACHE.mp; }
async function loadProv(){ const {data}=await dbList('proveedores',{ordenCol:'nombre'}); CACHE.prov=data||[]; return CACHE.prov; }
async function loadProductos(){ const {data}=await dbList('productos',{filtros:{activo:true},ordenCol:'codigo'}); return data||[]; }
/* --- formato y fechas --- */
function fmtKg(n){ n=Number(n)||0; return (Math.round(n*100)/100).toLocaleString('es-CL'); }
function hoyISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function ddmmaaFrom(iso){ if(!iso)return''; const [a,m,d]=iso.split('-'); return d+m+a.slice(2); }
function addMonthsISO(iso,m){ const d=new Date(iso+'T00:00:00'); d.setMonth(d.getMonth()+Number(m||0)); return d.toISOString().slice(0,10); }
function estadoPill(e){ const map={en_proceso:['gray','En proceso'],seco:['on','Seco'],cuarentena:['gray','Cuarentena'],reproceso:['off','Reproceso'],no_conforme:['off','No conforme'],liberado:['on','Liberado']}; const [c,t]=map[e]||['gray',e||'—']; return el('span',{class:'pill '+c},t); }
/* --- layout helpers para modales custom --- */
function lab(text,node){ return el('div',{}, el('label',{},text), node); }
function row2(a,b){ return el('div',{class:'grid2'}, a, b); }
function th(t){return el('th',{},t);}
function td(c){return el('td',{}, typeof c==='string'?document.createTextNode(c):c);}
function trMsg(t){return el('tr',{}, el('td',{class:'empty',colspan:'9'},t));}
function pill(on){return el('span',{class:'pill '+(on?'on':'off')}, on?'Activo':'Inactivo');}
function filterRows(tbody,q){q=q.toLowerCase();
  [...tbody.querySelectorAll('tr')].forEach(tr=>{
    tr.style.display = tr.textContent.toLowerCase().includes(q)?'':'none';});}
function inp(label,key,val,ph,extra){
  const type=(extra&&extra.trim())||'text';
  const e=el('input',{class:'field',type, value:(val??''), placeholder:ph||''});
  return {el:e, wrap:el('div',{}, el('label',{},label), e)};
}
function inpArea(label,key,val){
  const e=el('textarea',{class:'field',rows:'2'}); e.value=val??'';
  return {el:e, wrap:el('div',{}, el('label',{},label), e)};
}
function sel(label,key,opts,val){
  const e=el('select',{class:'field'});
  opts.forEach(([v,t])=>{const o=el('option',{value:v},t); if(v===val)o.selected=true; e.appendChild(o);});
  return {el:e, wrap:el('div',{}, el('label',{},label), e)};
}
function selRaw(label,key,html){
  const e=el('select',{class:'field'}); e.innerHTML=html;
  return {el:e, wrap:el('div',{}, el('label',{},label), e)};
}
function checkbox(label,on){
  const e=el('input',{type:'checkbox'}); e.checked=!!on;
  const w=el('label',{class:'chk'}, e, el('span',{},label));
  return {el:e, wrap:w};
}
function fullWrap(node){ node.classList.add('full'); return node; }

/* ========================= MODAL ========================= */
function openModal(title, fields, onSave){
  const root=$('#modalRoot');
  const grid=el('div',{class:'grid2'}); fields.forEach(f=>grid.appendChild(f));
  const btnSave=el('button',{class:'btn'},'Guardar');
  const modal=el('div',{class:'modal'}, el('h3',{},title), grid,
    el('div',{class:'actions'},
      el('button',{class:'btn sec',onclick:close},'Cancelar'), btnSave));
  const ov=el('div',{class:'ov',onclick:e=>{if(e.target===ov)close();}}, modal);
  function close(){ root.innerHTML=''; }
  btnSave.addEventListener('click',async()=>{
    btnSave.disabled=true; btnSave.textContent='Guardando…';
    let okClose=true;
    try{ okClose = await onSave(); }catch(err){ toast('Error: '+err.message); okClose=false; }
    btnSave.disabled=false; btnSave.textContent='Guardar';
    if(okClose!==false) close();
  });
  root.innerHTML=''; root.appendChild(ov);
}

function openCustomModal(title, bodyNode, onSave){
  const root=$('#modalRoot');
  const btnSave=el('button',{class:'btn'},'Guardar');
  const modal=el('div',{class:'modal',style:'max-width:600px'}, el('h3',{},title), bodyNode,
    el('div',{class:'actions'}, el('button',{class:'btn sec',onclick:close},'Cancelar'), btnSave));
  const ov=el('div',{class:'ov',onclick:e=>{if(e.target===ov)close();}}, modal);
  function close(){ root.innerHTML=''; }
  btnSave.addEventListener('click',async()=>{
    btnSave.disabled=true; btnSave.textContent='Guardando…';
    let ok=true; try{ ok=await onSave(); }catch(err){ toast('Error: '+err.message); ok=false; }
    btnSave.disabled=false; btnSave.textContent='Guardar';
    if(ok!==false) close();
  });
  root.innerHTML=''; root.appendChild(ov);
}
